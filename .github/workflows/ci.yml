name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          python-version: "3.12"
      - run: cd backend && uv sync --locked
      - run: make lint-backend test-backend
      - run: python3 scripts/check_i18n.py

  ui:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          package_json_file: ui/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - run: cd ui && pnpm install --frozen-lockfile
      - run: make lint-ui test-ui

  core-stack:
    # Proves the step-2 criterion: the whole core starts with no API key, a chat request
    # goes through LiteLLM to a cassette, and tokens/cost are recorded in the database.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          python-version: "3.12"
      - run: cd backend && uv sync --locked
      - run: make dev
      - run: make smoke
      - run: make test-integration
      - name: Logs on failure
        if: failure()
        run: docker compose -f core/compose.yml logs --tail=80
      - run: make dev-down
        if: always()

  e2e:
    # Browser test of the UI against the full stack (activate, projects, language/theme).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          package_json_file: ui/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - run: cd ui && pnpm install --frozen-lockfile && pnpm exec playwright install --with-deps chromium
      - run: make e2e
      - name: Logs on failure
        if: failure()
        run: docker compose -f core/compose.yml logs --tail=80
      - run: make dev-down
        if: always()
