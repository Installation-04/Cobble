# Cobble core stack. Only Caddy publishes a port on the host.
# Images are pinned by digest (never :latest). Secrets come from core/.env,
# generated by scripts/dev_env.py.
name: cobble

x-hardening: &hardening
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  restart: unless-stopped

x-app-env: &app-env
  COBBLE_DATABASE_URL: postgresql+psycopg://cobble:${POSTGRES_PASSWORD}@postgres:5432/cobble
  COBBLE_REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
  COBBLE_LITELLM_URL: http://litellm:4000
  COBBLE_LITELLM_KEY: ${LITELLM_MASTER_KEY}
  COBBLE_LANG: ${COBBLE_LANG:-en}
  COBBLE_PUBLIC_URL: ${COBBLE_PUBLIC_URL:-http://localhost:8080}
  COBBLE_RUN_TOKEN_SECRET: ${RUN_TOKEN_SECRET:-}

services:
  postgres:
    image: postgres:16-alpine@sha256:0cefaabd882e42bcb2a2f3dc56d3ce4770560ba62fd7f197f1a2e008fd5731ab
    <<: *hardening
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    environment:
      POSTGRES_USER: cobble
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: cobble
    volumes: [cobble-postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cobble -d cobble"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 512m
    networks: [core]

  redis:
    image: redis:7-alpine@sha256:8da19c7399dca900c6822a1cf30f9d2285585e2c4b457ff4095b0f4500054d3f
    <<: *hardening
    user: redis
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    volumes: [cobble-redis-data:/data]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 256m
    networks: [core]

  fake-llm:
    build: ../providers/fake-llm
    <<: *hardening
    environment:
      FAKE_LLM_ALLOW_DEFAULT: "1"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/healthz')"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 256m
    networks: [core]

  litellm:
    image: ghcr.io/berriai/litellm:v1.106.6@sha256:37e2dafb088a7723beb998590682957386dfc83ffea1848486f8e0e5cfac0b06
    <<: *hardening
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      # Use the bundled price table: no network access needed at startup (offline-first).
      LITELLM_LOCAL_MODEL_COST_MAP: "True"
    volumes: [./litellm/config.yaml:/app/config.yaml:ro]
    depends_on:
      fake-llm: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:4000/health/liveliness')"]
      interval: 5s
      timeout: 5s
      retries: 40
    mem_limit: 1g
    # egress: real providers (API keys) are reached from LiteLLM only.
    networks: [core, egress]

  api:
    build: ../backend
    # Pack settings (Forgejo/Woodpecker endpoints and tokens), written by packs/v01/hooks.
    env_file:
      - path: ../packs/v01/.env.pack
        required: false
    <<: *hardening
    command: ["sh", "-c", "alembic upgrade head && exec uvicorn cobble.api.app:create_app --factory --host 0.0.0.0 --port 8000"]
    environment: *app-env
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      litellm: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 5s
      timeout: 5s
      retries: 30
    mem_limit: 512m
    networks: [core]

  worker:
    build: ../backend
    # Pack settings (Forgejo/Woodpecker endpoints and tokens), written by packs/v01/hooks.
    env_file:
      - path: ../packs/v01/.env.pack
        required: false
      # Agent-service URL and token, written by packs/v01/agent-service/gen-env.sh.
      - path: ../packs/v01/.env.agents.core
        required: false
    <<: *hardening
    command: ["python", "-m", "cobble.worker"]
    environment: *app-env
    depends_on:
      api: {condition: service_healthy}
    # The project template the scheduler copies into each new repository.
    volumes: [../templates/fastapi-react:/templates/fastapi-react:ro]
    mem_limit: 512m
    networks: [core]

  ui:
    build: ../ui
    <<: *hardening
    cap_add: [NET_BIND_SERVICE]  # the caddy binary carries this file capability
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 64m
    networks: [core]

  caddy:
    image: caddy:2-alpine@sha256:e70b164da81ef698b3ad19af799ea6086ce6d9e48ed4079eb9fe26f6fbf14ee5
    <<: *hardening
    cap_add: [NET_BIND_SERVICE]
    ports: ["${COBBLE_HTTP_PORT:-80}:80"]
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ../packs/v01/caddy:/etc/caddy/pack:ro
      - cobble-caddy-data:/data
    depends_on:
      api: {condition: service_healthy}
      ui: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:80/api/v1/health"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 128m
    networks: [core, edge]

networks:
  core:
    internal: true
  edge: {}
  egress: {}

volumes:
  cobble-postgres-data:
  cobble-redis-data:
  cobble-caddy-data:
