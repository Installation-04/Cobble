# Cobble pack v0.1, part 2: the agent runner side (agent-service + egress proxy).
# Own compose project; can be merged with compose.yml (`-f compose.yml -f compose.agents.yml`).
# No published host port. Secrets come from .env.agents, generated by
# agent-service/gen-env.sh (never committed, mode 600).
#
#   docker compose -f compose.agents.yml --profile build build   # agent-proxy, agent-service, runner
#   agent-service/gen-env.sh && docker compose -f compose.agents.yml up -d
name: cobble-pack-agents

x-hardening: &hardening
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  restart: unless-stopped

services:
  # Allow-list HTTP proxy: the only way out of the agents network.
  # AGENT_PROXY_ALLOW: comma separated host names (default below). The "api" entry is the host of
  # COBBLE_INTERNAL_API_URL; keep both in sync if you rename the API service.
  agent-proxy:
    build: ./agent-proxy
    image: cobble-agent-proxy:0.1
    <<: *hardening
    read_only: true
    tmpfs: ["/tmp:size=4m,uid=10004,mode=700"]
    environment:
      AGENT_PROXY_ALLOW: ${AGENT_PROXY_ALLOW:-api,pypi.org,files.pythonhosted.org,registry.npmjs.org}
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 3128"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 128m
    pids_limit: 128
    # agents: where the sandboxes are (internal, no route out); core: to reach the API.
    networks: [agents, core]

  # The ONE container of the agent side that mounts the Docker socket (CLAUDE.md rule 5).
  # It starts the agent containers; it never runs agent-written code itself.
  agent-service:
    build: ./agent-service
    image: cobble-agent-service:0.1
    <<: *hardening
    user: "10001:10001"
    group_add: ["${DOCKER_GID:-0}"]
    read_only: true
    tmpfs: ["/tmp:size=64m,uid=10001,mode=700"]
    env_file:
      - path: .env.agents
        required: false
    environment:
      COBBLE_AGENT_DATA_VOLUME: cobble_agents_data
      COBBLE_AGENT_NETWORK: ${COBBLE_AGENT_NETWORK:-cobble_agents}
      COBBLE_AGENT_RUNNER_IMAGE: ${COBBLE_AGENT_RUNNER_IMAGE:-cobble-aider-runner:0.1}
      COBBLE_AGENT_PROXY_URL: http://agent-proxy:3128
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - agents-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8090/healthz')"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 512m
    pids_limit: 256
    depends_on:
      agent-proxy: {condition: service_healthy}
    networks: [core]

  # Build-only entry: `docker compose --profile build build` also builds the runner image.
  agent-runner-image:
    build:
      context: ../../runners/aider
      additional_contexts:
        template: ../../templates/fastapi-react  # pre-warms the runner's uv cache
    image: ${COBBLE_AGENT_RUNNER_IMAGE:-cobble-aider-runner:0.1}
    profiles: [build]
    entrypoint: ["true"]

networks:
  # Agent sandboxes live here. internal: no route to the host or the internet; the only
  # neighbour that can leave is agent-proxy, which is allow-list only.
  agents:
    name: ${COBBLE_AGENT_NETWORK:-cobble_agents}
    internal: true
  # Core network (compose project `cobble`): created by the core stack, never by the pack.
  core:
    name: ${COBBLE_CORE_NETWORK:-cobble_core}
    external: true

volumes:
  agents-data:
    name: cobble_agents_data
