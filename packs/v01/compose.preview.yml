# Cobble pack v0.1, part 3: the milestone demos (preview-service). Own compose project; merge
# with the others (`-f compose.yml -f compose.agents.yml -f compose.preview.yml`).
# No published host port. Secrets come from .env.preview, generated by
# preview-service/gen-env.sh (never committed, mode 600).
#
#   docker compose -f compose.preview.yml build
#   preview-service/gen-env.sh && docker compose -f compose.preview.yml up -d
#   cp preview-service/demo.caddy caddy/demo.caddy      # then reload the core Caddy
name: cobble-pack-preview

x-hardening: &hardening
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  restart: unless-stopped

services:
  # Builds the generated app at a tag (docker build through the Engine API), runs it as a
  # confined container and reverse-proxies /demo/<project>/<milestone>/. It holds the Docker
  # socket (CLAUDE.md rule 5); it never runs generated code itself.
  preview-service:
    build: ./preview-service
    image: cobble-preview-service:0.1
    <<: *hardening
    user: "10001:10001"
    group_add: ["${DOCKER_GID:-0}"]
    read_only: true
    tmpfs: ["/tmp:size=64m,uid=10001,mode=700"]
    env_file:
      - path: .env.preview
        required: false
    environment:
      COBBLE_PREVIEW_NETWORK: ${COBBLE_PREVIEW_NETWORK:-cobble_previews}
      COBBLE_PREVIEW_DATA_DIR: /data
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - previews-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8091/healthz')"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 512m
    pids_limit: 256
    # core: reached by the api/worker and by Caddy; previews: where the demo containers live.
    networks: [core, previews]

networks:
  # Demo containers live here. internal: no route to the host or the internet; preview-service
  # is their only neighbour. Created by the pack, so the network must exist before a deploy.
  previews:
    name: ${COBBLE_PREVIEW_NETWORK:-cobble_previews}
    internal: true
  # Core network (compose project `cobble`): created by the core stack, never by the pack.
  core:
    name: ${COBBLE_CORE_NETWORK:-cobble_core}
    external: true

volumes:
  previews-data:
    name: cobble_previews_data
