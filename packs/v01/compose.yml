# Cobble fixed pack v0.1: git server + CI. Own compose project, no published host port
# (the core's Caddy exposes the web UIs, see caddy/pack.caddy).
# Images are pinned by digest. Secrets come from packs/v01/.env, generated by
# hooks/install.sh (never committed).
name: cobble-pack

x-hardening: &hardening
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  restart: unless-stopped

services:
  forgejo:
    image: codeberg.org/forgejo/forgejo:15.0.11-rootless@sha256:3cd6bc2b74c87cbde0a0fd527c9665cb416f5a0540dee54fe5afb3fa2df9f40c
    <<: *hardening
    environment:
      FORGEJO__security__INSTALL_LOCK: "true"
      FORGEJO__security__SECRET_KEY: ${FORGEJO_SECRET_KEY:-}
      FORGEJO__server__DOMAIN: ${PACK_PUBLIC_HOST:-localhost}
      FORGEJO__server__ROOT_URL: ${PACK_PUBLIC_URL:-http://localhost}/git/
      FORGEJO__server__HTTP_PORT: "3000"
      FORGEJO__server__DISABLE_SSH: "true"
      FORGEJO__server__OFFLINE_MODE: "true"
      FORGEJO__database__DB_TYPE: sqlite3
      FORGEJO__service__DISABLE_REGISTRATION: "true"
      FORGEJO__service__REQUIRE_SIGNIN_VIEW: "true"
      FORGEJO__service__DEFAULT_ALLOW_CREATE_ORGANIZATION: "false"
      FORGEJO__repository__DEFAULT_PRIVATE: private
      FORGEJO__repository__DEFAULT_BRANCH: main
      FORGEJO__actions__ENABLED: "false"
      FORGEJO__mailer__ENABLED: "false"
      FORGEJO__webhook__ALLOWED_HOST_LIST: woodpecker-server
      FORGEJO__webhook__SKIP_TLS_VERIFY: "false"
      FORGEJO__log__LEVEL: Info
      FORGEJO__other__SHOW_FOOTER_VERSION: "false"
    volumes:
      - cobble-pack-forgejo-data:/var/lib/gitea
      - cobble-pack-forgejo-conf:/etc/gitea
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/api/healthz"]
      interval: 5s
      timeout: 3s
      retries: 40
    mem_limit: 1g
    pids_limit: 512
    # pack: talks to woodpecker-server; ci: pipeline steps clone from it; core: core api/worker.
    networks: [pack, ci, core]

  # Lets pipeline containers reach the PUBLIC git URL (the clone URL the forge reports, and the
  # host the git credentials are bound to). On the ci network it answers to the public host name
  # (PACK_GATEWAY_ALIAS, set by install.sh when the public host is a name and not an IP) and
  # port, and serves the same routes as the core's Caddy (caddy/pack.caddy).
  pack-gateway:
    image: caddy:2-alpine@sha256:e70b164da81ef698b3ad19af799ea6086ce6d9e48ed4079eb9fe26f6fbf14ee5
    <<: *hardening
    cap_add: [NET_BIND_SERVICE]
    environment:
      PACK_PUBLIC_PORT: ${PACK_PUBLIC_PORT:-80}
    volumes:
      - ./caddy/gateway.Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy/pack.caddy:/etc/caddy/pack.caddy:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:${PACK_PUBLIC_PORT:-80}/git/api/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 128m
    pids_limit: 128
    networks:
      ci:
        aliases: [pack-gateway, "${PACK_GATEWAY_ALIAS:-pack-gateway}"]
      pack: {}

  # One-shot: the woodpecker volume must belong to the unprivileged server user.
  woodpecker-init:
    image: alpine:3.20@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    cap_add: [CHOWN]
    restart: "no"
    command: ["chown", "-R", "10002:10002", "/var/lib/woodpecker"]
    volumes:
      - cobble-pack-woodpecker-data:/var/lib/woodpecker
    mem_limit: 32m
    networks: [pack]

  woodpecker-server:
    image: quay.io/woodpeckerci/woodpecker-server:v3.20.1@sha256:0f31560e29d67ec4a06d6eeee4bac38d2a2697a6a741b8a0db3998180f3a3517
    <<: *hardening
    user: "10002:10002"
    environment:
      WOODPECKER_HOST: ${PACK_PUBLIC_URL:-http://localhost}/ci
      WOODPECKER_OPEN: "false"
      WOODPECKER_ADMIN: ${PACK_SERVICE_USER:-cobble-bot}
      WOODPECKER_AGENT_SECRET: ${WOODPECKER_AGENT_SECRET:-}
      WOODPECKER_GRPC_SECRET: ${WOODPECKER_GRPC_SECRET:-}
      WOODPECKER_FORGEJO: "true"
      # Everything between Woodpecker and the forge stays on the private network. Consequence:
      # the Woodpecker web login (browser OAuth) is not available in v0.1; the core uses the
      # API token minted headlessly by hooks/install.sh.
      WOODPECKER_FORGEJO_URL: http://forgejo:3000
      WOODPECKER_EXPERT_WEBHOOK_HOST: http://woodpecker-server:8000/ci
      WOODPECKER_FORGEJO_CLIENT: ${WOODPECKER_FORGEJO_CLIENT:-}
      WOODPECKER_FORGEJO_SECRET: ${WOODPECKER_FORGEJO_SECRET:-}
      # Clone plugin pinned by digest (it handles git credentials, hence the trust entry).
      WOODPECKER_DEFAULT_CLONE_PLUGIN: quay.io/woodpeckerci/plugin-git:2.11.0@sha256:9802cb7852dcf31f9c5c1d1ddeadfb9002d4fae85751f7b6a792eedb267bcc59
      WOODPECKER_PLUGINS_TRUSTED_CLONE: quay.io/woodpeckerci/plugin-git:2.11.0@sha256:9802cb7852dcf31f9c5c1d1ddeadfb9002d4fae85751f7b6a792eedb267bcc59
      # Variables every pipeline sees. COBBLE_SKIP_STEPS: scanners to skip on hosts without
      # internet access (operator choice, e.g. "trivy,semgrep"). PACK_PIPELINE_ENV: extra
      # "KEY:value,KEY:value" (for example a proxy CA).
      WOODPECKER_ENVIRONMENT: COBBLE_SKIP_STEPS:${PACK_SKIP_STEPS:-none}${PACK_PIPELINE_ENV:+,${PACK_PIPELINE_ENV}}
      WOODPECKER_DISABLE_VERSION_CHECK: "true"
      WOODPECKER_DEFAULT_PIPELINE_TIMEOUT: "30"
      WOODPECKER_LOG_LEVEL: info
    volumes:
      - cobble-pack-woodpecker-data:/var/lib/woodpecker
    depends_on:
      woodpecker-init: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "/bin/woodpecker-server", "ping"]
      interval: 5s
      timeout: 3s
      retries: 40
    mem_limit: 512m
    pids_limit: 256
    networks: [pack, core]

  # The ONLY container of the pack (and of Cobble) that mounts the Docker socket:
  # Woodpecker's docker backend needs it to start pipeline containers. Accepted by
  # CLAUDE.md rule 5 as a pack service; see docs/en/pack.md for the risk and mitigations
  # (agent only, no published port, no capabilities, pipeline steps limited and never
  # privileged, repositories never marked "trusted").
  woodpecker-agent:
    image: quay.io/woodpeckerci/woodpecker-agent:v3.20.1@sha256:a7d7299a13add0b3936fa0ac9ed23507fe283a7fc7d9596c4289d7e8206541eb
    <<: *hardening
    user: "10003:10003"
    group_add: ["${DOCKER_GID:-0}"]
    environment:
      WOODPECKER_SERVER: woodpecker-server:9000
      WOODPECKER_AGENT_SECRET: ${WOODPECKER_AGENT_SECRET:-}
      WOODPECKER_BACKEND_DOCKER_NETWORK: cobble-pack-ci
      WOODPECKER_MAX_WORKFLOWS: ${PACK_CI_PARALLELISM:-2}
      # Optional read-only mounts for steps, comma separated (for example a proxy CA bundle).
      WOODPECKER_BACKEND_DOCKER_VOLUMES: ${PACK_STEP_VOLUMES:-}
      WOODPECKER_BACKEND_DOCKER_LIMIT_MEM: ${PACK_STEP_MEM_BYTES:-2147483648}
      WOODPECKER_BACKEND_DOCKER_LIMIT_CPU_QUOTA: ${PACK_STEP_CPU_QUOTA:-200000}
      WOODPECKER_HEALTHCHECK: "true"
      WOODPECKER_HEALTHCHECK_ADDR: ":3000"
      WOODPECKER_LOG_LEVEL: info
      WOODPECKER_AGENT_LABELS: cobble.pack=v01
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      woodpecker-server: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "/bin/woodpecker-agent", "ping"]
      interval: 10s
      timeout: 3s
      retries: 20
    mem_limit: 256m
    pids_limit: 256
    networks: [pack]

networks:
  # Private to the pack (no outside access).
  pack:
    name: cobble-pack-internal
    internal: true
  # Pipeline steps and forgejo: steps need registries (pip, npm, scanner databases).
  ci:
    name: cobble-pack-ci
  # The core network (compose project `cobble`), so core api/worker reach forgejo and
  # woodpecker-server by name. Created by the core stack; the pack never creates it.
  core:
    name: cobble_core
    external: true

volumes:
  cobble-pack-forgejo-data:
  cobble-pack-forgejo-conf:
  cobble-pack-woodpecker-data:
