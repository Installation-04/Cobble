[project]
name = "cobble"
version = "0.1.0.dev0"
description = "Self-hosted platform that turns an idea into an application."
requires-python = ">=3.12"
license = "AGPL-3.0-only"
dependencies = []

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cobble"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "C4", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"../scripts/**" = ["S101"]

[tool.mypy]
strict = true
files = ["cobble"]

[tool.pytest.ini_options]
testpaths = ["tests", "../scripts/tests"]
