# Forgejo: the Git server (capability `git`). Converted from the v0.1 pack.
id: forgejo
name: Forgejo
version: 15.0.11
category: git
description:
  en: Self-hosted Git server where Cobble keeps the code of your projects.
  fr: Serveur Git auto-hébergé où Cobble garde le code de vos projets.
license: GPL-3.0-or-later
provides: [git]
exclusive: [git]
images:
  - codeberg.org/forgejo/forgejo:15.0.11-rootless@sha256:3cd6bc2b74c87cbde0a0fd527c9665cb416f5a0540dee54fe5afb3fa2df9f40c
compose: compose.yml
web_ui:
  service: forgejo
  port: 3000
  path: /git
healthcheck:
  http: /api/healthz
# secret_key and admin_password are generated by the platform; api_token is minted by the
# post-install hook and is the only secret the core may read.
secrets: [secret_key, admin_password]
core_secrets: [api_token]
# Shared with the hooks of modules that require `git` (for example the CI signs in as the
# service account); never with the core.
# Also the API token, for modules that push and clone on the core's behalf (agents, previews).
link_secrets: [admin_password, api_token]
hooks:
  post_install: hooks/post-install.sh
backup:
  volumes: [forgejo_data, forgejo_conf]
